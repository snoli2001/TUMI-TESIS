services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con la base goberlab de tumi2}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: ${QDRANT_URL:?Define QDRANT_URL del Qdrant externo}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.1}
      OPENAI_MODEL_MINI: ${OPENAI_MODEL_MINI:-gpt-5.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_DECISION_MODEL: ${OPENAI_DECISION_MODEL:-gpt-6-luna}
      DECISION_MIN_CONFIDENCE: ${DECISION_MIN_CONFIDENCE:-0.55}
      DECISION_RELEVANCE_MIN: ${DECISION_RELEVANCE_MIN:-0.4}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JNE_API_BASE_URL: ${JNE_API_BASE_URL:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_TOKEN: ${API_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    expose:
      - "3000"
    networks:
      - internal
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL con la base goberlab de tumi2}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: ${QDRANT_URL:?Define QDRANT_URL del Qdrant externo}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  redis_data:
