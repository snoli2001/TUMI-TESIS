<h1>Candidatos</h1>
<p class="muted">Padrón del esquema tumi, en la base de QAS.</p>
<form (submit)="$event.preventDefault(); search()">
  <input
    [value]="q()"
    (input)="q.set($any($event.target).value)"
    placeholder="Apellido, nombre o partido"
  />
  <button type="submit">Buscar</button>
</form>
@if (error()) {
  <p>{{ error() }}</p>
}
@if (!rows().length && !error()) {
  <p class="muted">Escribe al menos un apellido para buscar.</p>
}
<div class="grid">
  @for (row of rows(); track row.id) {
    <a class="panel card" [routerLink]="['/candidatos', row.id]">
      <h2>{{ row.nombre }}</h2>
      <p>{{ row.cargo }} · {{ row.partido }}</p>
    </a>
  }
</div>
